name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: Core checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run pack:check

  exhibits:
    name: Exhibit claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:evidence
      - run: npm run test:exhibits
      - run: npm run build:demo

  check:
    if: ${{ always() }}
    needs: [core, exhibits]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI layer
        env:
          CORE_RESULT: ${{ needs.core.result }}
          EXHIBITS_RESULT: ${{ needs.exhibits.result }}
        run: |
          test "$CORE_RESULT" = "success"
          test "$EXHIBITS_RESULT" = "success"
