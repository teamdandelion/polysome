name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the release pull request
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

      - uses: actions/checkout@v6
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v6
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install and verify
        if: ${{ steps.release.outputs.release_created }}
        run: npm ci && npm run check

      - name: Publish to npm
        if: ${{ steps.release.outputs.release_created }}
        run: npm publish

      - name: Notify dandelion.art
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.DANDELION_ART_DISPATCH_TOKEN }}
          POLYSOME_VERSION: ${{ steps.release.outputs.version }}
          POLYSOME_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::DANDELION_ART_DISPATCH_TOKEN is not configured; skipping notification"
            exit 0
          fi
          gh api --method POST repos/teamdandelion/dandelion.art/dispatches \
            --raw-field event_type=polysome-released \
            --raw-field "client_payload[package]=@teamdandelion/polysome" \
            --raw-field "client_payload[version]=$POLYSOME_VERSION" \
            --raw-field "client_payload[tag]=$POLYSOME_TAG" \
            --raw-field "client_payload[repository]=${{ github.repository }}"
